<div class="min-h-screen flex items-center justify-center bg-green-500">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">Login</h2>

    <form (ngSubmit)="login()" class="space-y-4">
      <input
        [(ngModel)]="email"
        name="email"
        type="email"
        placeholder="Email"
        class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"
        required
      />

      <input
        [(ngModel)]="password"
        name="password"
        type="password"
        placeholder="Password"
        class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"
        required
      />

      <button
        type="submit"
        class="w-full bg-green-500 text-white p-3 rounded-lg hover:bg-green-600 transition"
      >
        🌱 Login 🌱
      </button>
    </form>

    <p class="text-center mt-4 text-sm">
      Don't have an account?
      <a routerLink="/register" class="text-green-600 font-semibold">Register</a>
    </p>
  </div>
</div>
