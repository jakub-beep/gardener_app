<div class="min-h-screen flex items-center justify-center bg-green-500">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md flex flex-col items-center">
    <h2 class="text-2xl font-bold text-center mb-6">Register</h2>

    <form (ngSubmit)="register()" class="space-y-4">
      <!-- Email -->
      <input
        [(ngModel)]="email"
        name="email"
        type="email"
        placeholder="Email"
        class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"
        required
      />

      <!-- Password -->
      <input
        [(ngModel)]="password"
        name="password"
        type="password"
        placeholder="Password"
        class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"
        required
      />

      <!-- Button -->
      <button
        type="submit"
        class="w-full bg-green-500 text-white p-3 rounded-lg hover:bg-green-600 transition"
      >
        🌱 Register 🌱
      </button>
    </form>

    <p class="text-center mt-6 text-sm">
      Already have an account?
      <a routerLink="/login" class="text-green-600 font-semibold">Login</a>
    </p>
  </div>
</div>
