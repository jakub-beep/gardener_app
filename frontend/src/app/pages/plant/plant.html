<div class="flex mx-auto max-w-5xl p-6">
  <div class="">
    <app-left-nav navTitle="Menu" />
  </div>
  <div>
    <div class="mb-6">
      <input
        type="text"
        placeholder="Search plants..."
        [(ngModel)]="searchTerm"
        class="w-full rounded-lg border border-green-300 px-4 py-2 focus:border-green-500 focus:outline-none"
      />
    </div>

    <!-- Empty state -->
    @if (filterPlants().length === 0) {
      <div class="rounded-lg border border-green-200 bg-green-50 p-6 text-center text-green-800">
        No plants found.
      </div>
    }

    <!-- Plant list -->
    <div class="space-y-3">
      @for (plant of filterPlants(); track plant.id) {
        <div
          class="flex flex-col gap-3 rounded-lg border border-green-200 bg-white p-4 shadow-sm md:flex-row md:items-center"
        >
          <!-- Plant info -->
          <div class="flex-1">
            <div class="font-semibold text-green-800">
              {{ plant.name }}
            </div>

            <div class="text-sm text-gray-600">
              {{ plant.species }}
            </div>

            <div class="text-sm text-gray-500">
              Water every {{ plant.watering_frequency_days }} days
            </div>
          </div>

          <!-- Garden name input -->
          <input
            type="text"
            placeholder="Garden name"
            #gardenInput
            class="rounded-lg border border-green-300 px-3 py-2 focus:border-green-500 focus:outline-none"
          />

          <!-- Add button -->
          <button
            class="rounded-lg bg-green-600 px-4 py-2 font-medium text-white transition hover:bg-green-700 disabled:cursor-not-allowed disabled:bg-gray-300"
            [disabled]="!isValidGardenName(gardenInput.value)"
            (click)="addPlantToGarden(plant.name, gardenInput.value)"
          >
            Add to my garden
          </button>
        </div>
      }
    </div>
  </div>
</div>
