<div class="flex w-full gap-6 p-6">
  <div class="">
    <app-left-nav navTitle="Menu" />
  </div>
  <div class="w-full">
    <div class="mb-6">
      <input
        type="text"
        placeholder="Search plants..."
        [(ngModel)]="searchTerm"
        class="w-full rounded-lg border border-green-300 px-4 py-2 focus:border-green-500 focus:outline-none"
      />
    </div>

    <!-- Empty state -->
    @if (filterPlants().length === 0) {
      <div class="rounded-lg border border-green-200 bg-green-50 p-6 text-center text-green-800">
        No plants found.
      </div>
    }

    <!-- Plant list -->
    <div class="grid gap-4 [grid-template-columns:repeat(auto-fit,minmax(280px,1fr))]">
      @for (plant of filterPlants(); track plant.id) {
        <div class="rounded-lg border border-green-200 bg-white p-4 shadow-sm">
          <div class="flex items-start justify-between">
            <div>
              <div class="font-semibold text-green-800">
                {{ plant.name }}
              </div>

              <div class="text-sm text-gray-600">
                {{ plant.species }}
              </div>

              <div class="text-sm text-gray-500">
                Water every {{ plant.watering_frequency_days }} days
              </div>
            </div>

            <!-- Add to garden -->
            <div class="relative">
              <button
                class="flex items-center gap-2 rounded-lg bg-green-600 px-3 py-2 text-white hover:bg-green-700"
                (click)="toggleGardenMenu(plant.id)"
              >
                <fa-icon [icon]="faSeedling"></fa-icon>
                <fa-icon [icon]="faPlus"></fa-icon>
              </button>

              @if (openedPlantId === plant.id) {
                <div class="absolute right-0 z-10 mt-2 w-56 rounded-lg border bg-white shadow-lg">
                  @for (garden of gardenStore.gardens(); track garden.id) {
                    <button
                      class="block w-full px-4 py-2 text-left hover:bg-green-50"
                      (click)="addPlantToGarden(plant.id, garden.id)"
                    >
                      {{ garden.name }}
                    </button>
                  }
                </div>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
